<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Store</title>
  <script src="assets/js/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['system-ui','sans-serif'], body: ['system-ui','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="theme.css">
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="{ dark: localStorage.getItem('dark')==='true', userOpen:false, mobileOpen:false, query:'', cartCount(){return 0;}, wishlistCount(){return 0;} }" x-init="if(dark) document.documentElement.classList.add('dark'); $watch('dark', v=>{localStorage.setItem('dark',v);document.documentElement.classList.toggle('dark',v);})">

  <div id="app-header" data-page="notifications"></div>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-6">
      <h1 class="font-display text-3xl font-bold text-gray-900">Notifications</h1>
      <div class="flex gap-2">
        <button @click="$store.notifications.markAllRead()" class="text-sm text-brand-600 hover:underline">Mark all read</button>
        <button @click="$store.notifications.clear()" class="text-sm text-gray-500 hover:text-red-500">Clear</button>
      </div>
    </div>

    <div x-show="$store.notifications.items.length===0" class="bg-white rounded-2xl border border-gray-100 p-12 text-center shadow-sm">
      <div class="text-5xl mb-4">🔔</div>
      <p class="text-gray-600">You're all caught up.</p>
    </div>

    <div class="space-y-3" x-show="$store.notifications.items.length>0">
      <template x-for="n in $store.notifications.items" :key="n.id">
        <div class="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm flex gap-4 items-start" :class="!n.read ? 'border-l-4 border-l-brand-500' : ''">
          <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center flex-shrink-0">🔔</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-semibold text-gray-900" x-text="n.title"></h3>
              <span class="text-xs text-gray-400" x-text="n.date"></span>
            </div>
            <p class="text-sm text-gray-500 mt-1" x-text="n.body"></p>
          </div>
          <button @click="$store.notifications.remove(n.id)" class="text-gray-400 hover:text-red-500 transition text-sm">✕</button>
        </div>
      </template>
    </div>
  </main>

  <div id="app-footer"></div>

  <script>
    // no-op: notifications state lives in Alpine store
  </script>
</body>
</html>
