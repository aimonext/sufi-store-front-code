<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['"Playfair Display"','serif'], body: ['Inter','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap&family=Playfair+Display:wght@500;600;700&display=swap&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}</style>
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="contactPage()">

  <div id="app-header" data-page="contact"></div>

  <section class="max-w-5xl mx-auto px-4 py-16 grid md:grid-cols-2 gap-10">
    <div>
      <p class="text-brand-600 text-sm font-semibold tracking-widest uppercase mb-3">Get in touch</p>
      <h1 class="font-display text-4xl font-bold text-gray-900">We'd love to hear from you.</h1>
      <p class="mt-4 text-gray-500 leading-relaxed">Questions about an order, a product, or just want to say hello? Send us a message and we'll get back within 24 hours.</p>
      <div class="mt-8 space-y-4 text-sm text-gray-600">
        <div class="flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center">✉</span> hello@lumen.store</div>
        <div class="flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center">☎</span> +1 (555) 012-3456</div>
        <div class="flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center">📍</span> 123 Market St, San Francisco, CA</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
      <form @submit.prevent="submit()" class="space-y-4">
        <input type="text" required placeholder="Your name" x-model="form.name" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
        <input type="email" required placeholder="Email address" x-model="form.email" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
        <input type="text" placeholder="Subject" x-model="form.subject" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
        <textarea required rows="5" placeholder="Message" x-model="form.message" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400 resize-none"></textarea>
        <button type="submit" class="w-full bg-gray-900 hover:bg-brand-600 text-white py-3 rounded-full font-medium transition" :disabled="sending" x-text="sent?'Message sent ✓':(sending?'Sending…':'Send message')"></button>
        <p x-show="sent" x-cloak class="text-sm text-brand-600 text-center">Thanks! We'll reply soon.</p>
      </form>
    </div>
  </section>

  <div id="app-footer"></div>
</body>
</html>
