<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['"Playfair Display"','serif'], body: ['Inter','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap&family=Playfair+Display:wght@500;600;700&display=swap&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}</style>
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="cartPage()">

  <div id="app-header" data-page="cart"></div>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="font-display text-3xl font-bold text-gray-900 mb-6">Your cart</h1>

    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2 space-y-4">
        <template x-if="cart.length===0">
          <div class="bg-white rounded-2xl border border-gray-100 p-12 text-center shadow-sm">
            <div class="text-5xl mb-4">🛒</div>
            <p class="text-gray-600 mb-4">Your cart is empty.</p>
            <a href="index.html" class="inline-block px-6 py-2.5 bg-gray-900 text-white rounded-full font-medium hover:bg-brand-600 transition">Continue shopping</a>
          </div>
        </template>

        <template x-for="item in cart" :key="item.id">
          <div class="bg-white rounded-2xl border border-gray-100 p-4 flex gap-4 items-center shadow-sm">
            <img decoding="async" loading="lazy" :src="item.img" :alt="item.name" class="w-20 h-20 rounded-xl object-cover" />
            <div class="flex-1 min-w-0">
              <div class="font-medium text-gray-900" x-text="item.name"></div>
              <div class="text-xs text-gray-400 mt-0.5" x-show="item.variant && Object.keys(item.variant).length" x-text="Object.entries(item.variant||{}).map(([k,v])=>k+': '+v).join(' · ')"></div>
              <div class="text-sm text-gray-500 mt-0.5" x-text="'$'+item.price+' each'"></div>
            </div>
            <div class="flex items-center gap-2">
              <button @click="dec(item.id)" class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center hover:bg-gray-50">−</button>
              <span class="w-8 text-center font-medium" x-text="item.qty"></span>
              <button @click="inc(item.id)" class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center hover:bg-gray-50">+</button>
            </div>
            <div class="w-20 text-right font-bold text-gray-900" x-text="'$'+(item.price*item.qty).toFixed(2)"></div>
            <button @click="removeItem(item.id)" class="text-gray-400 hover:text-red-500 transition" aria-label="Remove">✕</button>
          </div>
        </template>
      </div>

      <aside class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm h-fit sticky top-24">
        <h2 class="font-semibold text-gray-900 mb-4">Order summary</h2>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between text-gray-600"><span>Subtotal</span><span x-text="'$'+cartTotal().toFixed(2)"></span></div>
          <div class="flex justify-between text-gray-600"><span>Shipping</span><span>Calculated at checkout</span></div>
        </div>
        <div class="border-t border-gray-100 mt-4 pt-4 flex justify-between font-bold text-gray-900">
          <span>Total</span><span x-text="'$'+cartTotal().toFixed(2)"></span>
        </div>
        <a href="checkout.html" :class="cart.length===0?'pointer-events-none opacity-50':''" class="mt-6 block text-center w-full bg-gray-900 hover:bg-brand-600 text-white py-3 rounded-full font-medium transition">Proceed to checkout</a>
        <a href="index.html" class="mt-3 block text-center text-sm text-brand-600 hover:underline">Continue shopping</a>
      </aside>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
