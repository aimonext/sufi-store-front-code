<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['"Playfair Display"','serif'], body: ['Inter','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}</style>
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="ordersPage()">

  <div id="app-header" data-page="orders"></div>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="font-display text-3xl font-bold text-gray-900 mb-6">Your orders</h1>

    <div x-show="orders.length===0" class="bg-white rounded-2xl border border-gray-100 p-12 text-center shadow-sm">
      <div class="text-5xl mb-4">📦</div>
      <p class="text-gray-600 mb-4">You haven't placed any orders yet.</p>
      <a href="index.html" class="inline-block px-6 py-2.5 bg-gray-900 text-white rounded-full font-medium hover:bg-brand-600 transition">Start shopping</a>
    </div>

    <div class="space-y-6" x-show="orders.length>0">
      <template x-for="o in orders" :key="o.id">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
          <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <div class="font-semibold text-gray-900" x-text="o.id"></div>
              <div class="text-sm text-gray-500" x-text="o.date"></div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full" :class="o.status==='Delivered'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'" x-text="o.status"></span>
              <span class="font-bold text-gray-900" x-text="'$'+o.total.toFixed(2)"></span>
            </div>
          </div>
          <div class="p-5 space-y-3">
            <template x-for="item in o.items" :key="item.id">
              <div class="flex gap-3 items-center">
                <img loading="lazy" :src="item.img" :alt="item.name" class="w-12 h-12 rounded-lg object-cover" />
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium truncate" x-text="item.name"></div>
                  <div class="text-xs text-gray-400 truncate" x-show="item.variant && Object.keys(item.variant).length" x-text="Object.entries(item.variant||{}).map(([k,v])=>v).join(' / ')"></div>
                  <div class="text-xs text-gray-500" x-text="'×'+item.qty"></div>
                </div>
                <div class="text-sm font-bold" x-text="'$'+(item.price*item.qty).toFixed(2)"></div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
