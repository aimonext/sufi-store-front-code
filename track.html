<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — Store</title>
  <script src="assets/js/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['system-ui','sans-serif'], body: ['system-ui','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="theme.css">
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="trackPage()">

  <div id="app-header" data-page="track"></div>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="font-display text-3xl font-bold text-gray-900 mb-6">Track your order</h1>

    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm mb-6">
      <form @submit.prevent="track()" class="flex gap-3">
        <input type="text" placeholder="Enter order code (e.g. ORD-XXXX)" x-model="code" class="flex-1 px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
        <button type="submit" class="px-6 py-2.5 bg-gray-900 hover:bg-brand-600 text-white rounded-lg font-medium transition">Track</button>
      </form>
      <p x-show="error" x-cloak class="text-sm text-red-500 mt-3" x-text="error"></p>
    </div>

    <div x-show="order" x-cloak class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <div class="font-semibold text-gray-900" x-text="order ? order.id : ''"></div>
          <div class="text-sm text-gray-500" x-text="order ? 'Placed on ' + order.date : ''"></div>
        </div>
        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-amber-100 text-amber-700" x-text="order ? order.status : ''"></span>
      </div>

      <!-- Timeline -->
      <div>
        <div class="flex items-center justify-between">
          <template x-for="(s,i) in statuses" :key="s">
            <div class="flex-1 flex flex-col items-center">
              <div :class="stepIndex() >= i ? 'bg-brand-600 text-white' : 'bg-gray-200 text-gray-400'" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition" x-text="i+1"></div>
              <div class="text-[10px] mt-1" :class="stepIndex() >= i ? 'text-brand-600 font-medium' : 'text-gray-400'" x-text="s"></div>
            </div>
          </template>
        </div>
        <div class="relative mt-2 h-1 bg-gray-200 rounded-full">
          <div class="absolute left-0 top-0 h-1 bg-brand-600 rounded-full transition-all" :style="'width:' + ((stepIndex()/(statuses.length-1))*100) + '%'"></div>
        </div>
      </div>

      <!-- Items -->
      <div class="space-y-3">
        <template x-for="item in (order ? order.items : [])" :key="item.id">
          <div class="flex gap-3 items-center">
            <img decoding="async" loading="lazy" :src="item.img" :alt="item.name" class="w-12 h-12 rounded-lg object-cover" />
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate" x-text="item.name"></div>
              <div class="text-xs text-gray-500" x-text="'×'+item.qty"></div>
            </div>
            <div class="text-sm font-bold" x-text="'$'+(item.price*item.qty).toFixed(2)"></div>
          </div>
        </template>
      </div>

      <div class="border-t border-gray-100 pt-4 space-y-2 text-sm text-gray-600">
        <div class="flex justify-between"><span>Shipping</span><span x-text="order ? (order.shippingAddress || '—') : ''"></span></div>
        <div class="flex justify-between"><span>Payment</span><span x-text="order ? (order.paymentMethod || '—') : ''"></span></div>
        <div class="flex justify-between"><span>Tracking #</span><span x-text="order ? (order.trackingNumber || '—') : ''"></span></div>
      </div>
      <div class="border-t border-gray-100 pt-4 flex justify-between font-bold text-gray-900">
        <span>Total</span><span x-text="order ? '$'+order.total.toFixed(2) : ''"></span>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script>
  </script>
</body>
</html>
