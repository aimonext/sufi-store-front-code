<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#f5f7ff',100:'#ebeffe',200:'#d6ddfe',300:'#b3befd',400:'#8a98fc',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } },
        fontFamily: { display: ['"Playfair Display"','serif'], body: ['Inter','sans-serif'] },
        boxShadow: { soft: '0 10px 40px -10px rgba(0,0,0,0.12)' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap&family=Playfair+Display:wght@500;600;700&display=swap&display=swap" rel="stylesheet">
  <style>[x-cloak]{display:none!important}</style>
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50 text-gray-800 font-body antialiased" x-data="checkoutPage()">

  <div id="app-header" data-page="checkout"></div>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="font-display text-3xl font-bold text-gray-900 mb-6">Checkout</h1>

    <div x-show="success" x-cloak class="bg-white rounded-2xl border border-gray-100 p-12 text-center shadow-sm mb-6">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="font-display text-2xl font-bold text-gray-900 mb-2">Order placed!</h2>
      <p class="text-gray-600 mb-6">Thank you for your purchase. A confirmation has been sent.</p>
      <a href="index.html" class="inline-block px-6 py-2.5 bg-gray-900 text-white rounded-full font-medium hover:bg-brand-600 transition">Back to shop</a>
    </div>

    <div x-show="!success" class="grid lg:grid-cols-3 gap-8">
      <!-- Form -->
      <form @submit.prevent="placeOrder()" class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
          <h2 class="font-semibold text-gray-900 mb-4">Contact</h2>
          <div class="space-y-3">
            <input type="email" required placeholder="Email address" x-model="form.email" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
          <h2 class="font-semibold text-gray-900 mb-4">Shipping address</h2>
          <div class="grid sm:grid-cols-2 gap-3">
            <input type="text" required placeholder="First name" x-model="form.firstName" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <input type="text" required placeholder="Last name" x-model="form.lastName" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <input type="text" required placeholder="Address" x-model="form.address" class="sm:col-span-2 px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <input type="text" required placeholder="City" x-model="form.city" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <input type="text" required placeholder="ZIP code" x-model="form.zip" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
          <h2 class="font-semibold text-gray-900 mb-4">Payment</h2>
          <div class="space-y-3">
            <input type="text" required placeholder="Card number" x-model="form.card" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <div class="grid grid-cols-2 gap-3">
              <input type="text" required placeholder="MM/YY" x-model="form.expiry" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
              <input type="text" required placeholder="CVC" x-model="form.cvc" class="px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-400" />
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-gray-900 hover:bg-brand-600 text-white py-3.5 rounded-full font-medium transition shadow" :disabled="cart.length===0 || placing" x-text="placing?'Placing order…':'Place order'"></button>
      </form>

      <!-- Summary -->
      <aside class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm h-fit sticky top-24">
        <h2 class="font-semibold text-gray-900 mb-4">Order summary</h2>
        <div class="space-y-3 max-h-64 overflow-y-auto">
          <template x-for="item in cart" :key="item.id">
            <div class="flex gap-3 items-center">
              <img decoding="async" loading="lazy" :src="item.img" :alt="item.name" class="w-12 h-12 rounded-lg object-cover" />
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium truncate" x-text="item.name"></div>
                <div class="text-xs text-gray-400 truncate" x-show="item.variant && Object.keys(item.variant).length" x-text="Object.entries(item.variant||{}).map(([k,v])=>v).join(' / ')"></div>
                <div class="text-xs text-gray-500" x-text="'×'+item.qty"></div>
              </div>
              <div class="text-sm font-bold" x-text="'$'+(item.price*item.qty).toFixed(2)"></div>
            </div>
          </template>
        </div>
        <div class="border-t border-gray-100 mt-4 pt-4 space-y-2 text-sm">
          <div class="flex justify-between text-gray-600"><span>Subtotal</span><span x-text="'$'+cartTotal().toFixed(2)"></span></div>
          <div class="flex justify-between text-gray-600"><span>Shipping</span><span>$5.00</span></div>
        </div>
        <div class="border-t border-gray-100 mt-4 pt-4 flex justify-between font-bold text-gray-900">
          <span>Total</span><span x-text="'$'+(cartTotal()+5).toFixed(2)"></span>
        </div>
        <a href="cart.html" class="mt-4 block text-center text-sm text-brand-600 hover:underline">Edit cart</a>
      </aside>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
